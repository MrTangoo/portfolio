<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <!-- Lanyard -->
  <path d="M84 0 L100 22 L116 0" stroke="#9A9A9A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Clip -->
  <rect x="93" y="20" width="14" height="11" stroke="#111111" stroke-width="1.5"/>

  <!-- Badge, swaying gently around the clip -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-2.4 100 30; 2.4 100 30; -2.4 100 30"
      keyTimes="0; 0.5; 1"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
      calcMode="spline"
      dur="6.5s"
      repeatCount="indefinite"
    />
    <!-- Card -->
    <rect x="58" y="30" width="84" height="100" stroke="#111111" stroke-width="1.5"/>
    <!-- Photo zone -->
    <rect x="70" y="44" width="30" height="36" stroke="#111111" stroke-width="1.5"/>
    <circle cx="85" cy="57" r="6" stroke="#9A9A9A" stroke-width="1.5"/>
    <path d="M75 76 a10 10 0 0 1 20 0" stroke="#9A9A9A" stroke-width="1.5"/>
    <!-- Name / role lines -->
    <rect x="108" y="48" width="22" height="4" fill="#9A9A9A"/>
    <rect x="108" y="58" width="15" height="4" fill="#9A9A9A"/>
    <rect x="108" y="68" width="19" height="4" fill="#E34234"/>
    <!-- Details -->
    <rect x="70" y="92" width="60" height="4" fill="#9A9A9A"/>
    <rect x="70" y="102" width="46" height="4" fill="#9A9A9A"/>
    <!-- Vermilion marker -->
    <rect x="70" y="114" width="8" height="8" fill="#E34234"/>
  </g>
</svg>
