<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Registration marks -->
  <path d="M14 150 h8 M18 146 v8" stroke="#9A9A9A" stroke-width="1.2"/>
  <path d="M218 24 h8 M222 20 v8" stroke="#9A9A9A" stroke-width="1.2"/>

  <!-- Draft: dashed wireframe window -->
  <rect x="24" y="30" width="132" height="88" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <line x1="24" y1="48" x2="156" y2="48" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Measure guide between draft and build -->
  <line x1="152" y1="112" x2="92" y2="66" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="3 4">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Baseline that draws itself under the build -->
  <line x1="88" y1="162" x2="216" y2="162" stroke="#E34234" stroke-width="2" stroke-dasharray="128">
    <animate attributeName="stroke-dashoffset" values="128;0;0;128" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- Build: solid window, gentle float -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -3; 0 0"
      keyTimes="0; 0.5; 1"
      dur="8s"
      repeatCount="indefinite"
    />
    <rect x="88" y="62" width="128" height="92" fill="#F5F4F0" stroke="#111111" stroke-width="1.5"/>
    <line x1="88" y1="80" x2="216" y2="80" stroke="#111111" stroke-width="1.5"/>
    <!-- Window squares -->
    <rect x="95" y="69" width="5" height="5" fill="#9A9A9A"/>
    <rect x="104" y="69" width="5" height="5" fill="#9A9A9A"/>
    <rect x="113" y="69" width="5" height="5" fill="#E34234"/>
    <line x1="126" y1="71.5" x2="190" y2="71.5" stroke="#9A9A9A" stroke-width="1.5"/>

    <!-- Interface blocks materialize in sequence -->
    <rect x="96" y="88" width="20" height="58" fill="#9A9A9A">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.16;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="124" y="88" width="56" height="6" fill="#111111">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.28;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="124" y="102" width="72" height="5" fill="#9A9A9A">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="124" y="114" width="48" height="5" fill="#9A9A9A">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.52;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="124" y="130" width="30" height="11" fill="#E34234">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.64;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="130" width="11" height="11" stroke="#9A9A9A" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.76;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- Orbiting node at the window corner -->
    <circle cx="216" cy="62" r="10" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="3 4">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 216 62"
        to="360 216 62"
        dur="24s"
        repeatCount="indefinite"
      />
    </circle>
    <rect x="213.5" y="59.5" width="5" height="5" fill="#E34234"/>
  </g>
</svg>
