<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -3; 0 0"
      keyTimes="0; 0.5; 1"
      dur="8s"
      repeatCount="indefinite"
    />
    <!-- Window -->
    <rect x="22" y="14" width="156" height="108" stroke="#111111" stroke-width="1.5"/>
    <line x1="22" y1="36" x2="178" y2="36" stroke="#111111" stroke-width="1.5"/>
    <!-- Window squares -->
    <rect x="30" y="22" width="6" height="6" fill="#9A9A9A"/>
    <rect x="41" y="22" width="6" height="6" fill="#9A9A9A"/>
    <rect x="52" y="22" width="6" height="6" fill="#E34234"/>
    <line x1="66" y1="25" x2="150" y2="25" stroke="#9A9A9A" stroke-width="1.5"/>
    <!-- Code lines -->
    <rect x="34" y="48" width="58" height="5" fill="#9A9A9A"/>
    <rect x="34" y="60" width="18" height="5" fill="#E34234"/>
    <rect x="56" y="60" width="34" height="5" fill="#9A9A9A"/>
    <rect x="34" y="72" width="50" height="5" fill="#9A9A9A"/>
    <rect x="34" y="84" width="26" height="5" fill="#9A9A9A"/>
    <!-- Blinking cursor -->
    <rect x="34" y="97" width="4" height="14" fill="#111111">
      <animate
        attributeName="opacity"
        values="1; 1; 0; 0; 1"
        keyTimes="0; 0.5; 0.55; 0.95; 1"
        dur="1.6s"
        repeatCount="indefinite"
      />
    </rect>
    <!-- Chevron glyph -->
    <path d="M136 52 l-12 10 12 10" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
    <path d="M160 52 l12 10 -12 10" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
    <line x1="153" y1="48" x2="143" y2="76" stroke="#E34234" stroke-width="2"/>
  </g>
</svg>
