<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <!-- Ground -->
  <line x1="8" y1="124" x2="192" y2="124" stroke="#F5F4F0" stroke-width="1.5"/>

  <!-- Crane: mast, apex, tie bars, jib, counterweight, cab -->
  <g stroke="#F5F4F0" stroke-width="1.5">
    <line x1="40" y1="24" x2="40" y2="124"/>
    <line x1="24" y1="24" x2="182" y2="24"/>
    <line x1="40" y1="10" x2="40" y2="24"/>
    <rect x="16" y="26" width="12" height="14"/>
    <rect x="44" y="26" width="11" height="10"/>
  </g>
  <g stroke="#F5F4F0" stroke-width="1" opacity="0.7">
    <line x1="40" y1="10" x2="24" y2="24"/>
    <line x1="40" y1="10" x2="172" y2="24"/>
  </g>

  <!-- Wall, running bond -->
  <g stroke="#F5F4F0" stroke-width="1.5">
    <rect x="110" y="114" width="14" height="10"/>
    <rect x="124" y="114" width="14" height="10"/>
    <rect x="138" y="114" width="14" height="10"/>
    <rect x="152" y="114" width="14" height="10"/>
    <rect x="166" y="114" width="14" height="10"/>
    <rect x="117" y="104" width="14" height="10"/>
    <rect x="131" y="104" width="14" height="10"/>
    <rect x="145" y="104" width="14" height="10"/>
    <rect x="159" y="104" width="14" height="10"/>
    <rect x="110" y="94" width="14" height="10"/>
    <rect x="124" y="94" width="14" height="10"/>
  </g>

  <!-- Trolley carrying a vermilion brick along the jib -->
  <g>
    <animateMotion
      dur="9s"
      repeatCount="indefinite"
      path="M112 0 H158"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
      keyPoints="0; 1; 0"
      keyTimes="0; 0.5; 1"
    />
    <rect x="-5" y="19" width="10" height="8" stroke="#F5F4F0" stroke-width="1.5"/>
    <line x1="0" y1="27" x2="0" y2="80" stroke="#F5F4F0" stroke-width="1" opacity="0.7"/>
    <rect x="-7" y="80" width="14" height="10" fill="#E34234"/>
  </g>
</svg>
