<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Dashed path, marching slowly towards the flag -->
  <path
    d="M16 96 C60 96 64 48 104 48 S150 74 184 30"
    stroke="#9A9A9A"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-dasharray="3 7"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="10"
      to="0"
      dur="1.2s"
      repeatCount="indefinite"
    />
  </path>
  <!-- Waypoints -->
  <rect x="12" y="92" width="8" height="8" fill="#111111"/>
  <rect x="100" y="44" width="8" height="8" fill="#111111" opacity="0.55"/>
  <!-- Flag -->
  <line x1="184" y1="12" x2="184" y2="30" stroke="#111111" stroke-width="1.5"/>
  <path d="M184 14 L198 19 L184 24 Z" fill="#E34234"/>
</svg>
