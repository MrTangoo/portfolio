<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" fill="none">
  <defs>
    <g id="envelope">
      <rect x="-30" y="-20" width="60" height="40"
            fill="#111111" stroke="#f5f4f0"
            stroke-opacity="0.9" stroke-width="1.5"/>
      <path d="M-29 -18 L0 4 L29 -18" stroke="#f5f4f0"
            stroke-opacity="0.9" stroke-width="1.5" fill="none"/>
      <rect x="-3" y="1" width="6" height="6" fill="#e34234"/>
    </g>
  </defs>

  <style>
    .dash { animation: drift 14s linear infinite; }
    @keyframes drift { to { stroke-dashoffset: -48; } }
    .tout line, .tback line { opacity: 0; animation: streak 10s ease-in-out infinite; }
    .tout line:nth-child(2), .tback line:nth-child(2) { animation-delay: 0.1s; }
    .tout line:nth-child(3), .tback line:nth-child(3) { animation-delay: 0.2s; }
    @keyframes streak {
      0%, 34%, 62%, 72%, 96%, 100% { opacity: 0; }
      42%, 54% { opacity: 0.5; }
      80%, 90% { opacity: 0.5; }
    }
    .sq {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 10s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 58%, 84%, 100% { transform: scale(1); }
      64%                { transform: scale(1.9); }
      72%                { transform: scale(1.35); }
    }
    .stat { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .dash, .tout line, .tback line, .sq { animation: none !important; }
      .anim { display: none !important; }
      .stat { display: block !important; }
    }
  </style>

  <!-- Trajectoire -->
  <path class="dash" d="M52 122 C 104 124 138 88 204 36"
        stroke="#f5f4f0" stroke-opacity="0.26" stroke-width="1.5"
        stroke-dasharray="5 7" stroke-linecap="square"/>

  <!-- Marqueur d'arrivée -->
  <rect class="sq" x="200" y="32" width="8" height="8" fill="#e34234"/>

  <g class="anim">
    <!-- Sillage aller -->
    <g class="tout" stroke="#f5f4f0" stroke-opacity="0.9"
       stroke-width="1.5" stroke-linecap="square">
      <line x1="80" y1="128" x2="104" y2="112"/>
      <line x1="62" y1="140" x2="82" y2="126"/>
      <line x1="104" y1="140" x2="128" y2="124"/>
    </g>

    <!-- Sillage retour -->
    <g class="tback" stroke="#f5f4f0" stroke-opacity="0.9"
       stroke-width="1.5" stroke-linecap="square">
      <line x1="150" y1="78" x2="126" y2="94"/>
      <line x1="168" y1="66" x2="148" y2="80"/>
      <line x1="128" y1="90" x2="104" y2="106"/>
    </g>

    <!-- Étincelle vermillon sur l'aller -->
    <circle r="2.5" fill="#e34234" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite"
        calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.38;0.64;1"
        keySplines="0 0 1 1; 0.45 0 0.3 1; 0 0 1 1"
        path="M52 122 C 104 124 138 88 204 36"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
        values="0;0;0.9;0;0" keyTimes="0;0.38;0.5;0.64;1"/>
    </circle>

    <!-- Enveloppe : aller-retour le long de la courbe -->
    <g transform="translate(52 122)">
      <animateMotion dur="10s" repeatCount="indefinite"
        calcMode="spline" keyPoints="0;0;1;1;0;0" keyTimes="0;0.32;0.62;0.7;0.94;1"
        keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1"
        path="M0 0 C 52 2 86 -34 152 -86"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="10s"
          repeatCount="indefinite" additive="sum"
          values="0 0; 0 -4; 0 0; 0 -3; 0 0; 0 0; 0 -4; 0 0; 0 0; 0 0"
          keyTimes="0;0.08;0.16;0.24;0.32;0.62;0.66;0.7;0.94;1"/>
        <animateTransform attributeName="transform" type="rotate" dur="10s"
          repeatCount="indefinite" additive="sum"
          values="-4; -4; 7; 2; 0; -7; -3; -4; -4"
          keyTimes="0;0.32;0.45;0.62;0.7;0.84;0.94;0.97;1"/>
        <use href="#envelope"/>
      </g>
    </g>
  </g>

  <!-- Fallback statique (prefers-reduced-motion) -->
  <g class="stat" transform="translate(52 122)">
    <use href="#envelope"/>
  </g>
</svg>
